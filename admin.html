<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Grave Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans p-4 pb-20">
    
    <!-- LOGIN SECTION -->
    <div id="login-section" class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md border border-gray-200">
        <h2 class="text-2xl font-bold text-emerald-700 text-center mb-6">Admin Login</h2>
        <input type="email" id="email" placeholder="Your Email" class="w-full p-3 mb-4 border border-gray-300 rounded text-lg" />
        <input type="password" id="password" placeholder="Your Password" class="w-full p-3 mb-6 border border-gray-300 rounded text-lg" />
        <button onclick="login()" class="w-full bg-emerald-700 text-white p-3 rounded font-bold text-lg">Log In</button>
        <p id="login-message" class="text-center mt-4 font-bold"></p>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="max-w-md mx-auto mt-4 hidden">
        
        <!-- ADD GRAVE FORM -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-emerald-700">Add New Grave</h2>
                <button onclick="logout()" class="bg-gray-200 text-gray-700 px-3 py-1 rounded font-bold text-sm border border-gray-300">Log Out</button>
            </div>
            
            <label class="block font-bold mb-1">Grave ID (e.g. H124) *</label>
            <input type="text" id="grave_id" class="w-full p-2 mb-4 border border-gray-300 rounded" />

            <label class="block font-bold mb-1">Person's Name *</label>
            <input type="text" id="name" class="w-full p-2 mb-4 border border-gray-300 rounded" />

            <div class="flex gap-4 mb-4">
                <div class="w-1/2">
                    <label class="block font-bold mb-1">Section</label>
                    <input type="text" id="section" class="w-full p-2 border border-gray-300 rounded" />
                </div>
                <div class="w-1/2">
                    <label class="block font-bold mb-1">Row/Plot</label>
                    <input type="text" id="row_name" class="w-full p-2 border border-gray-300 rounded" />
                </div>
            </div>

            <div class="flex gap-4 mb-4">
                <div class="w-1/2">
                    <label class="block font-bold mb-1">Latitude *</label>
                    <input type="text" id="lat" placeholder="Paste Lat..." class="w-full p-2 border border-gray-300 rounded" />
                </div>
                <div class="w-1/2">
                    <label class="block font-bold mb-1">Longitude *</label>
                    <input type="text" id="lng" placeholder="Paste Lng..." class="w-full p-2 border border-gray-300 rounded" />
                </div>
            </div>

            <label class="block font-bold mb-1">Grave Photo</label>
            <input type="file" id="photo" accept="image/*" class="w-full p-2 mb-4 border border-gray-300 rounded bg-white" />

            <label class="block font-bold mb-1">Status</label>
            <select id="status" class="w-full p-2 mb-6 border border-gray-300 rounded bg-white">
                <option value="Needs cleaning">Needs cleaning</option>
                <option value="Cleaned">Cleaned</option>
            </select>

            <button onclick="addGrave()" class="w-full bg-emerald-700 text-white p-3 rounded font-bold text-lg">Save Grave</button>
            <p id="dashboard-message" class="text-center mt-4 font-bold"></p>
        </div>

        <!-- MANAGE GRAVES LIST WITH SEARCH -->
        <h2 class="text-2xl font-bold text-emerald-700 text-center mb-4">Manage Graves</h2>
        
        <input type="text" id="admin-search-box" onkeyup="renderAdminGraves()" placeholder="Search graves to edit..." class="w-full p-3 mb-4 border border-gray-300 rounded-lg shadow-sm text-lg" />
        
        <div id="admin-graves-list">
            <!-- Grave list will load here -->
        </div>

    </div>

    <script>
        const supabaseUrl = 'https://izpbjaochrsbiuqmkaph.supabase.co';
        const supabaseKey = 'sb_publishable_ea-AYzP2iC31711_5F_WDA_EXyerFNZ';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let allAdminGraves = []; 

        // NEW: Check if you are already logged in as soon as the page opens!
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                // You are already logged in! Skip straight to the dashboard.
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadAdminGraves();
            }
        }
        checkSession(); // Run the check immediately

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageBox = document.getElementById('login-message');
            
            messageBox.textContent = 'Logging in...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                messageBox.textContent = 'Error: ' + error.message;
                messageBox.className = 'text-center mt-4 font-bold text-red-600';
            } else {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadAdminGraves(); 
            }
        }

        // NEW: Allow you to securely log out
        async function logout() {
            await supabaseClient.auth.signOut();
            // Hide dashboard, show login screen again
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-message').textContent = '';
            document.getElementById('password').value = '';
        }

        async function addGrave() {
            const messageBox = document.getElementById('dashboard-message');
            const graveId = document.getElementById('grave_id').value;
            const name = document.getElementById('name').value;
            const lat = parseFloat(document.getElementById('lat').value);
            const lng = parseFloat(document.getElementById('lng').value);

            if (!graveId || !name || isNaN(lat) || isNaN(lng)) {
                messageBox.textContent = 'Please fill in required fields correctly.';
                messageBox.className = 'text-center mt-4 font-bold text-amber-600';
                return; 
            }

            messageBox.textContent = 'Saving...';
            let finalPhotoUrl = null;
            const photoInput = document.getElementById('photo');

            if (photoInput.files.length > 0) {
                const file = photoInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${graveId}-${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabaseClient.storage.from('grave-photos').upload(fileName, file);
                if (uploadError) return messageBox.textContent = 'Photo Error: ' + uploadError.message;
                const { data: urlData } = supabaseClient.storage.from('grave-photos').getPublicUrl(fileName);
                finalPhotoUrl = urlData.publicUrl;
            }

            const newGrave = {
                grave_id: graveId, name: name, section: document.getElementById('section').value,
                row_name: document.getElementById('row_name').value, latitude: lat, longitude: lng,
                status: document.getElementById('status').value, photo_url: finalPhotoUrl
            };

            const { error: dbError } = await supabaseClient.from('graves').insert([newGrave]);

            if (dbError) {
                messageBox.textContent = 'Error: ' + dbError.message;
            } else {
                messageBox.textContent = 'Success!';
                document.getElementById('grave_id').value = '';
                document.getElementById('name').value = '';
                document.getElementById('photo').value = '';
                loadAdminGraves(); 
            }
        }

        async function loadAdminGraves() {
            const list = document.getElementById('admin-graves-list');
            list.innerHTML = '<p class="text-center font-bold">Loading...</p>';
            
            const { data, error } = await supabaseClient.from('graves').select('*').order('created_at', { ascending: false });
            
            if (error) {
                list.innerHTML = `<p class="text-red-600">Error: ${error.message}</p>`;
                return;
            }

            allAdminGraves = data; 
            renderAdminGraves(); 
        }

        function renderAdminGraves() {
            const list = document.getElementById('admin-graves-list');
            const searchTerm = document.getElementById('admin-search-box').value.toLowerCase();
            
            list.innerHTML = '';

            const filteredGraves = allAdminGraves.filter(grave => {
                return (grave.name && grave.name.toLowerCase().includes(searchTerm)) || 
                       (grave.grave_id && grave.grave_id.toLowerCase().includes(searchTerm));
            });

            if (filteredGraves.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-600 font-bold">No graves found.</p>`;
                return;
            }

            filteredGraves.forEach(grave => {
                const isCleaned = grave.status === 'Cleaned';
                const nextStatus = isCleaned ? 'Needs cleaning' : 'Cleaned';
                const statusColor = isCleaned ? 'text-emerald-600' : 'text-amber-600';

                list.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-4 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                        <div>
                            <p class="font-bold text-lg">${grave.grave_id} - ${grave.name}</p>
                            <p class="text-sm font-bold ${statusColor}">${grave.status}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="updateStatus('${grave.id}', '${nextStatus}')" class="flex-1 bg-blue-100 text-blue-800 px-3 py-2 rounded font-bold text-sm">Toggle Status</button>
                            <button onclick="deleteGrave('${grave.id}')" class="flex-1 bg-red-100 text-red-800 px-3 py-2 rounded font-bold text-sm">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        async function updateStatus(id, newStatus) {
            await supabaseClient.from('graves').update({ status: newStatus }).eq('id', id);
            loadAdminGraves(); 
        }

        async function deleteGrave(id) {
            if(confirm("Are you sure you want to delete this grave?")) {
                await supabaseClient.from('graves').delete().eq('id', id);
                loadAdminGraves(); 
            }
        }
    </script>
</body>
</html>
